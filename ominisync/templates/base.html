{% load static %}<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Unify Gmail, WhatsApp, Telegram, and Outlook into a single cognitive brain. Let OmniSync AI automatically summarize chat threads, extract action-item reminders, and draft context-aware replies.">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}OmniSync.ai | Connected AI Personal Assistant &amp; Chief of Staff{% endblock %}</title>
  <script>try{var t=localStorage.getItem('theme')||'dark';document.documentElement.className=t;}catch(e){}</script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="{% static 'style.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" data-page="{{ page }}"{% if user.is_authenticated %} data-user-id="{{ user.profile.id }}"{% endif %}>
  <div class="grid-bg" aria-hidden="true"></div>
  {% block body %}{% endblock %}
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script>window.OMNISYNC_USER_ID = "{% if user.is_authenticated %}{{ user.profile.id }}{% else %}{% endif %}";</script>
  <script src="{% static 'app.js' %}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
