<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OmniSync - Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1020;
        color: #e6edf7;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      main { max-width: 360px; }
      img { width: 88px; height: 88px; border-radius: 22px; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { font-size: 14px; line-height: 1.6; color: #94a3b8; margin: 0 0 20px; }
      button {
        border: 0;
        border-radius: 999px;
        padding: 11px 22px;
        background: #22d3ee;
        color: #06121c;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="OmniSync" />
      <h1>You are offline</h1>
      <p>OmniSync needs a connection to sync your assistant data. Reconnect and try again.</p>
      <button type="button" onclick="location.replace('/')">Try again</button>
    </main>
  </body>
</html>
